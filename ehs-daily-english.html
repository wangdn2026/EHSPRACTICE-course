<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EHS 情景英语 · 每日听力</title>
<style>
:root,[data-theme="light"]{
  --brand:#0066cc; --en:#5a8a9f; --term:#E07A5F; --cn:#3D405B;
  --gray:#6c7280; --box:#e8f2f6; --bg:#f3f7fc; --surf:#fff;
  --txt:#333; --txt2:#666; --border:#e3ecf7;
  --hl:rgba(102,168,255,.15); --succ:#22c55e; --err:#ef4444;
  --aba:#3b82f6; --abb:#f59e0b; --sh:0 2px 10px rgba(0,0,0,.05);
  --r:12px; --rs:8px;
}
[data-theme="dark"]{
  --bg:#0f0f1a; --surf:#1a1a2e; --txt:#e0e0e0; --txt2:#a0a0a0;
  --border:#2a2a4a; --hl:rgba(102,168,255,.18); --box:#16213e;
  --cn:#e0e0e0; --gray:#a0a0a0; --sh:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;color:var(--txt);background:var(--bg);}
.app{max-width:480px;margin:0 auto;background:var(--surf);min-height:100dvh;box-shadow:0 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column;}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--surf);border-bottom:1px solid var(--border);}
.hdr-l{display:flex;align-items:center;gap:6px;}
.hdr-logo{font-size:15px;font-weight:800;color:var(--brand);}
.hdr-sub{font-size:11px;color:var(--txt2);}
.hdr-btn{width:32px;height:32px;border:none;background:transparent;font-size:16px;cursor:pointer;border-radius:50%;color:var(--txt2);display:flex;align-items:center;justify-content:center;}

/* Scene Tabs */
.tabs{display:flex;gap:4px;padding:6px 8px;background:var(--surf);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:5px 10px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surf);color:var(--txt2);transition:all .15s;white-space:nowrap;}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.tab-grp{flex:0 0 auto;padding:5px 6px;font-size:10px;font-weight:800;color:var(--txt2);display:flex;align-items:center;white-space:nowrap;opacity:.6;}

/* Content */
.content{flex:1;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;}

/* Illustration */
.illus{position:relative;width:100%;height:180px;background:linear-gradient(170deg,var(--box) 0%,var(--bg) 100%);overflow:hidden;}
.illus-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;opacity:.3;}
.illus img{width:100%;height:100%;object-fit:cover;}
.illus-cap{position:absolute;bottom:0;left:0;right:0;padding:10px 16px;background:linear-gradient(transparent,rgba(0,0,0,.55));}
.illus-cap .t{color:#fff;font-size:15px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.illus-cap .m{color:rgba(255,255,255,.75);font-size:11px;}

/* Subtitle Display */
.sub-area{display:flex;flex-direction:column;align-items:center;padding:16px 14px 8px;gap:8px;}
.sub-scroller{display:flex;align-items:center;gap:10px;width:100%;}
.scroll-btn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surf);color:var(--txt2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.scroll-btn:active{background:var(--hl);}
.sub-card{flex:1;background:var(--box);border-radius:var(--r);padding:16px 18px;text-align:center;min-height:90px;display:flex;flex-direction:column;justify-content:center;gap:6px;transition:all .25s;}
.sub-card.playing{border:2px solid var(--en);box-shadow:0 0 0 4px var(--hl);}
.sub-en{font-size:19px;font-weight:700;color:var(--en);line-height:1.45;margin:0;}
.sub-cn{font-size:13px;color:var(--cn);line-height:1.4;margin:0;}
.sub-pos{font-size:11px;color:var(--txt2);text-align:center;margin-bottom:2px;}

/* Progress & Speed Row */
.ctrl-row{display:flex;align-items:center;gap:8px;padding:0 14px 6px;}
.prog-wrap{flex:1;position:relative;}
.prog-bar{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:var(--box);border-radius:10px;outline:none;cursor:pointer;}
.prog-bar::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--brand);cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.15);}
.prog-bar::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--brand);cursor:pointer;border:none;box-shadow:0 2px 4px rgba(0,0,0,.15);}
.speed-sel{flex:0 0 auto;height:30px;padding:0 4px 0 8px;border:1px solid var(--border);border-radius:15px;background:var(--surf);font-size:11px;color:var(--txt2);display:flex;align-items:center;gap:2px;}
.speed-sel select{height:100%;border:none;background:transparent;font-size:11px;color:var(--txt);cursor:pointer;outline:none;}

/* Play Controls */
.play-row{display:flex;justify-content:center;align-items:center;gap:12px;padding:4px 0 10px;}
.pb{width:38px;height:38px;border-radius:50%;font-size:14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.pb-main{width:50px;height:50px;background:var(--term);color:#fff;border:none;font-size:20px;box-shadow:0 4px 12px rgba(224,122,95,.3);}
.pb-main:active{transform:scale(.92);}
.pb-sub{background:var(--surf);border:1px solid var(--border);color:var(--txt2);}
.pb-sub.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.pb-sub.active2{background:var(--aba);color:#fff;border-color:var(--aba);}
.pb-sub.active3{background:var(--abb);color:#fff;border-color:var(--abb);}

/* Phrase Wall */
.phrase-area{padding:6px 14px 16px;}
.phrase-title{font-size:12px;font-weight:700;color:var(--txt2);margin:0 0 6px;}
.phrase-wall{display:flex;flex-wrap:wrap;gap:6px;}
.phrase-chip{padding:6px 12px;border-radius:16px;background:var(--box);color:var(--txt);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);transition:all .15s;display:flex;flex-direction:column;align-items:center;line-height:1.3;}
.phrase-chip .p-en{color:var(--en);}
.phrase-chip .p-cn{color:var(--txt2);font-size:10px;}
.phrase-chip:active{background:var(--brand);color:#fff;border-color:var(--brand);}
.phrase-chip:active .p-en,.phrase-chip:active .p-cn{color:#fff;}
.phrase-empty{font-size:12px;color:var(--txt2);}

/* Views */
.view{display:none;}
.view.active{display:block;}

/* Dictation/Shadow/WordBook (compact) */
.aux-view{padding:14px;}
.aux-view h3{font-size:15px;color:var(--brand);text-align:center;margin:0 0 4px;}
.aux-view .aux-pos{text-align:center;font-size:11px;color:var(--txt2);margin-bottom:10px;}
.aux-card{background:var(--box);border-radius:var(--r);padding:14px;margin-bottom:10px;text-align:center;}
.aux-card .aux-en{font-size:17px;font-weight:700;color:var(--en);line-height:1.5;}
.aux-card .aux-cn{font-size:13px;color:var(--cn);margin-top:4px;}
.dict-blank{background:var(--box);border-radius:var(--r);padding:14px;font-size:17px;font-weight:600;color:var(--en);line-height:2.2;}
.dict-blank .bl{border:none;border-bottom:2px dashed var(--border);background:var(--input-bg,var(--surf));font-size:15px;text-align:center;padding:2px 6px;margin:0 3px;outline:none;color:var(--txt);min-width:50px;}
.dict-blank .bl.ok{border-bottom-color:var(--succ);color:var(--succ);}
.dict-blank .bl.no{border-bottom-color:var(--err);color:var(--err);}
.aux-res{text-align:center;font-size:15px;font-weight:700;padding:8px;min-height:20px;}
.btn-row{display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap;}
.btn{padding:9px 18px;border:none;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-p{background:var(--brand);color:#fff;}
.btn-s{background:var(--box);color:var(--txt2);border:1px solid var(--border);}
.btn-r{background:var(--err);color:#fff;}
.btn-r.rec{animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* Word Book */
.wb-card{background:var(--box);border-radius:var(--r);padding:10px 14px;margin-bottom:6px;}
.wb-word{font-size:15px;font-weight:700;color:var(--en);}
.wb-ipa{font-size:11px;color:var(--term);margin-left:4px;}
.wb-cn{font-size:12px;color:var(--cn);}
.wb-ctx{font-size:11px;color:var(--txt2);font-style:italic;margin-top:2px;}
.wb-play{font-size:11px;color:var(--brand);cursor:pointer;border:1px solid var(--brand);border-radius:10px;padding:2px 8px;display:inline-block;margin-top:4px;}
.wb-empty{padding:40px;text-align:center;font-size:14px;color:var(--txt2);}

@media print{.hdr,.tabs,.illus,.play-row,.ctrl-row,.phrase-area{display:none!important}body{background:#fff}.app{box-shadow:none}}
</style></head><body>
<div class="app">
  <!-- Header -->
  <div class="hdr">
    <div class="hdr-l"><span class="hdr-logo">EHS 每日英语</span><span class="hdr-sub">情景听力</span></div>
    <button class="hdr-btn" id="navTheme" title="暗色模式">🌙</button>
  </div>

  <!-- Scene Tabs -->
  <div class="tabs" id="sceneTabs"></div>

  <!-- Content -->
  <div class="content" id="content">
    <!-- Player View -->
    <div class="view active" id="viewPlayer">
      <!-- Illustration -->
      <div class="illus" id="illus">
        <div class="illus-inner" id="illusInner"></div>
        <div class="illus-cap"><div class="t" id="illusTitle"></div><div class="m" id="illusMeta"></div></div>
      </div>

      <!-- Subtitle Area -->
      <div class="sub-area">
        <div class="sub-scroller">
          <button class="scroll-btn" id="prevBtn">◁</button>
          <div class="sub-card" id="subCard">
            <p class="sub-en" id="subEn">--</p>
            <p class="sub-cn" id="subCn">--</p>
          </div>
          <button class="scroll-btn" id="nextBtn">▷</button>
        </div>
        <div class="sub-pos" id="subPos">第 1 / 0 句</div>
      </div>

      <!-- Progress + Speed -->
      <div class="ctrl-row">
        <div class="prog-wrap"><input type="range" class="prog-bar" id="progBar" min="0" max="0" value="0"></div>
        <div class="speed-sel" id="speedSel">🔊<select id="speedVal"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="0.9">0.9x</option><option value="1.0" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2.0">2x</option></select></div>
      </div>

      <!-- Play Controls -->
      <div class="play-row">
        <button class="pb pb-sub" id="btnSingle" title="单句循环">🔂</button>
        <button class="pb pb-main" id="btnPlay" title="播放/暂停">▶</button>
      </div>

      <!-- Phrase Wall -->
      <div class="phrase-area">
        <p class="phrase-title">📖 高频搭配（点一下听发音）</p>
        <div class="phrase-wall" id="phraseWall">
          <span class="phrase-empty">加载中...</span>
        </div>
      </div>
    </div>

    <!-- Dictation View -->
    <div class="view" id="viewDictate">
      <div class="aux-view">
        <h3>✏️ 听写模式</h3>
        <div class="aux-pos" id="dictPos">第 1 句</div>
        <div class="aux-card"><div class="aux-cn" id="dictHint"></div></div>
        <div class="dict-blank" id="dictSent"></div>
        <div class="aux-res" id="dictRes"></div>
        <div class="btn-row">
          <button class="btn btn-p" id="dictCheck">✓ 检查</button>
          <button class="btn btn-s" id="dictShow">👁 原文</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-p" id="dictListen">▶ 听原句</button>
          <button class="btn btn-s" id="dictNext">→ 下一句</button>
        </div>
        <div class="btn-row"><button class="btn btn-s" id="dictBack">← 返回播放</button></div>
      </div>
    </div>

    <!-- Shadow View -->
    <div class="view" id="viewShadow">
      <div class="aux-view">
        <h3>🎤 影子跟读</h3>
        <div class="aux-pos" id="shadowPos">第 1 句</div>
        <div class="aux-card"><div class="aux-en" id="shadowEn"></div></div>
        <div class="btn-row">
          <button class="btn btn-p" id="shadowListen">▶ 听原句</button>
          <button class="btn btn-r" id="shadowRec">🔴 录音</button>
          <button class="btn btn-p" id="shadowPlayRec" style="display:none">▶ 播放录音</button>
        </div>
        <div class="aux-res" id="shadowRes"></div>
        <div class="btn-row"><button class="btn btn-s" id="shadowNext">→ 下一句</button></div>
        <div class="btn-row"><button class="btn btn-s" id="shadowBack">← 返回播放</button></div>
      </div>
    </div>

    <!-- Word Book View -->
    <div class="view" id="viewWordBook">
      <div class="aux-view">
        <h3>📚 生词本</h3>
        <div class="aux-pos" id="wbCount">0 个单词</div>
        <div class="wb-empty" id="wbEmpty">💡 长按短语卡片即可收藏</div>
        <div id="wbList"></div>
        <div class="btn-row" style="margin-top:12px;">
          <button class="btn btn-s" id="wbFlashcard">🗂 闪卡</button>
          <button class="btn btn-s" id="wbExport">📤 导出</button>
          <button class="btn btn-s" id="wbClear">🗑 清空</button>
        </div>
        <div class="btn-row"><button class="btn btn-s" id="wbBack">← 返回播放</button></div>
      </div>
    </div>
  </div>
</div>

<audio id="player"></audio>

      {idx:1,en:"I'm doing well, thanks!",cn:"我很好，谢谢！",audioB64:"",dictate:{blankIndices:[]}},
      {idx:2,en:"Nice to meet you.",cn:"很高兴认识你。",audioB64:"",dictate:{blankIndices:[]}},
      {idx:3,en:"How do you do?",cn:"你好。",audioB64:"",dictate:{blankIndices:[]}},
      {idx:4,en:"Take care!",cn:"保重！",audioB64:"",dictate:{blankIndices:[]}}
    ]}
  ]};
  console.info('[模板] 当前是模板文件，未注入真实数据。请用 build 脚本生成 test_app.html，或直接打开 test_app.html。');
}

// ================ STATE ================
const S={ li:0, ci:0, rate:1, dark:false, playing:false, single:false, view:'player', dictIdx:0, shIdx:0 };
let pool={}, curA=null, mRec=null, rBlob=null;
function L(){return BUNDLE.lessons[S.li];}
function $x(id){return document.getElementById(id);}

// ================ AUDIO ================
function buildPool(){
  pool={}; L().sentences.forEach((s,i)=>{if(s.audioB64)pool[i]=new Audio('data:audio/mpeg;base64,'+s.audioB64);});
}
function play(i){
  stopAudio(); const a=pool[i]; if(!a) return;
  a.playbackRate=S.rate; S.ci=i; S.playing=true;
  a.play().catch(()=>{}); curA=a; curA.idx=i;
  updateSubCard(i); updateProg(i);
  $x('subCard').classList.add('playing');
  $x('btnPlay').textContent='⏸';
  a.onended=()=>{
    $x('subCard').classList.remove('playing');
    onEnded(i);
  };
}
function stopAudio(){if(curA){curA.pause();curA.onended=null;}curA=null;S.playing=false;$x('subCard').classList.remove('playing');$x('btnPlay').textContent='▶';}
function onEnded(i){
  const n=L().sentences.length;
  if(S.single){play(i);return;}
  if(i<n-1){play(i+1);}else{S.playing=false;$x('btnPlay').textContent='▶';}
  updateProg(S.ci);
}
function setRate(r){S.rate=parseFloat(r);if(curA)curA.playbackRate=S.rate;saveSettings();}

// ================ UI UPDATES ================
function updateSubCard(i){
  const s=L().sentences[i];
  $x('subEn').textContent=s.en; $x('subCn').textContent=s.cn;
  $x('subPos').textContent='第 '+(i+1)+' / '+L().sentences.length+' 句';
  $x('subCard').classList.toggle('playing',S.playing);
}
function updateProg(i){$x('progBar').value=i;}

// ================ PLAYER RENDER ================
function renderAll(){
  const l=L();
  // Illustration
  $x('illusTitle').textContent=l.title;
  $x('illusMeta').textContent=l.sentences.length+' 句 · '+(l.category==='ehs'?'EHS专业场景':'生活场景');
  $x('illusInner').innerHTML=l.image?'<img src="'+l.image+'" alt="'+l.title+'">':'<div style="font-size:40px;opacity:.4;">'+(l.category==='ehs'?'🏭':'💬')+'</div>';
  // Progress bar
  $x('progBar').max=l.sentences.length-1; $x('progBar').value=S.ci;
  // Current subtitle
  updateSubCard(S.ci);
  // Phrases
  renderPhrases();
  // Tabs
  renderTabs();
}
function renderTabs(){
  let h='<span class="tab-grp">💬 生活</span>';
  BUNDLE.lessons.forEach((l,i)=>{
    if(i===BUNDLE.lessons.length/2) h+='<span class="tab-grp">🏭 EHS</span>';
    // Shorten title to first meaningful part
    const short = l.title.split(' ')[0].substring(0,10);
    h+='<button class="tab'+(i===S.li?' active':'')+'" data-li="'+i+'" title="'+l.title+'">'+short+'</button>';
  });
  $x('sceneTabs').innerHTML=h;
  // Auto-scroll active tab into view
  setTimeout(()=>{
    const a=$x('sceneTabs').querySelector('.tab.active');
    if(a)a.scrollIntoView({inline:'center',behavior:'smooth'});
  },100);
}
function renderPhrases(){
  const l=L(); let h='';
  if(l.phrases&&l.phrases.length){
    l.phrases.forEach(p=>{h+='<span class="phrase-chip" data-phrase="'+p.en+'"><span class="p-en">'+p.en+'</span><span class="p-cn">'+p.cn+'</span></span>';});
  } else {
    h='<span class="phrase-empty">暂无高频搭配数据</span>';
  }
  $x('phraseWall').innerHTML=h;
}

// ================ EVENTS ================
// Scene tabs
$x('sceneTabs').addEventListener('click',function(e){
  const t=e.target.closest('.tab'); if(!t)return;
  const idx=parseInt(t.dataset.li); if(idx===S.li)return;
  S.li=idx; S.ci=0; stopAudio(); buildPool(); renderAll();
});

// Play/Pause
$x('btnPlay').addEventListener('click',function(){
  if(S.playing){stopAudio();return;}
  play(S.ci);
});

// Prev/Next
$x('prevBtn').addEventListener('click',function(){if(S.ci>0){stopAudio();S.ci--;play(S.ci);}});
$x('nextBtn').addEventListener('click',function(){const n=L().sentences.length;if(S.ci<n-1){stopAudio();S.ci++;play(S.ci);}});

// Progress bar
$x('progBar').addEventListener('input',function(){
  const i=parseInt(this.value); if(i!==S.ci){stopAudio();S.ci=i;play(i);}
});

// Speed
$x('speedVal').addEventListener('change',function(){setRate(this.value);});

// Single loop
$x('btnSingle').addEventListener('click',function(){S.single=!S.single;this.classList.toggle('active',S.single);});

// Phrase tap
$x('phraseWall').addEventListener('click',function(e){
  const c=e.target.closest('.phrase-chip'); if(!c)return;
  const word=c.dataset.phrase; if(!word||!speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=0.85;speechSynthesis.speak(u);
});
// Long press phrase to save word
let lt; $x('phraseWall').addEventListener('touchstart',function(e){
  const c=e.target.closest('.phrase-chip');if(!c)return;
  lt=setTimeout(()=>{const w=c.dataset.phrase;if(w)saveWord(w);},600);
},{passive:true});
$x('phraseWall').addEventListener('touchend',()=>clearTimeout(lt));
$x('phraseWall').addEventListener('touchmove',()=>clearTimeout(lt));

// ================ VIEWS ================
function switchView(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  const t=$x('view'+v.charAt(0).toUpperCase()+v.slice(1));
  if(t)t.classList.add('active'); S.view=v;
  if(v==='dictate')renderDict(S.dictIdx);
  if(v==='shadow')renderShadow(S.shIdx);
  if(v==='wordbook')renderWB();
}

// Dictation
function renderDict(i){
  const s=L().sentences[i];if(!s)return;
  $x('dictPos').textContent='第 '+(i+1)+' / '+L().sentences.length+' 句';
  $x('dictHint').textContent='💡 '+s.cn; $x('dictRes').innerHTML='';
  const words=s.en.split(/\s+/); const bl=(s.dictate&&s.dictate.blankIndices)?s.dictate.blankIndices:[];
  let h=''; words.forEach((w,j)=>{if(bl.includes(j))h+='<input class="bl" data-a="'+w+'" placeholder="___" size="'+Math.max(w.length,4)+'">';else h+='<span>'+w+'</span> ';});
  $x('dictSent').innerHTML=h;
}
$x('dictCheck').addEventListener('click',function(){
  const ins=document.querySelectorAll('#dictSent .bl'); let ok=0,t=ins.length;
  ins.forEach(x=>{const a=x.dataset.a.toLowerCase().replace(/[^a-z0-9-]/g,''),u=x.value.toLowerCase().trim().replace(/[^a-z0-9-]/g,'');
    if(u===a){x.classList.add('ok');x.classList.remove('no');ok++;}else{x.classList.add('no');x.classList.remove('ok');x.value=a;}});
  $x('dictRes').innerHTML=Math.round(ok/t*100)+'% '+(ok/t>=0.9?'⭐⭐⭐':ok/t>=0.7?'⭐⭐':'⭐');
});
$x('dictShow').addEventListener('click',function(){document.querySelectorAll('#dictSent .bl').forEach(x=>{x.value=x.dataset.a;x.classList.add('ok');});});
$x('dictListen').addEventListener('click',()=>play(S.dictIdx));
$x('dictNext').addEventListener('click',()=>{const n=L().sentences.length;if(S.dictIdx<n-1){S.dictIdx++;renderDict(S.dictIdx);}});
$x('dictBack').addEventListener('click',()=>switchView('player'));

// Shadow
function renderShadow(i){
  const s=L().sentences[i];if(!s)return;
  $x('shadowPos').textContent='第 '+(i+1)+' / '+L().sentences.length+' 句';
  $x('shadowEn').textContent=s.en;$x('shadowRes').innerHTML='';$x('shadowPlayRec').style.display='none';
}
$x('shadowListen').addEventListener('click',()=>play(S.shIdx));
$x('shadowRec').addEventListener('click',async function(){
  if(mRec&&mRec.state==='recording'){mRec.stop();this.textContent='🔴 录音';this.classList.remove('rec');return;}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mRec=new MediaRecorder(s);const ch=[];
    mRec.ondataavailable=e=>ch.push(e.data);
    mRec.onstop=()=>{rBlob=new Blob(ch,{type:'audio/webm'});$x('shadowPlayRec').style.display='';$x('shadowRes').textContent='录音完成 ✓';};
    mRec.start();this.textContent='⏹ 停止';this.classList.add('rec');
  }catch(e){$x('shadowRes').textContent='麦克风不可用';}
});
$x('shadowPlayRec').addEventListener('click',function(){if(rBlob)new Audio(URL.createObjectURL(rBlob)).play();});
$x('shadowNext').addEventListener('click',()=>{const n=L().sentences.length;if(S.shIdx<n-1){S.shIdx++;renderShadow(S.shIdx);}});
$x('shadowBack').addEventListener('click',()=>switchView('player'));

// Word Book
function loadWB(){try{return JSON.parse(localStorage.getItem('ehs_wb')||'[]');}catch(e){return[];}}
function saveWB(wb){localStorage.setItem('ehs_wb',JSON.stringify(wb));}
function saveWord(word){
  const wb=loadWB();if(wb.find(w=>w.w===word&&w.lid===L().id))return;
  wb.push({w:word,ipa:'',lid:L().id,ctx:L().sentences[S.ci]?L().sentences[S.ci].en:'',at:Date.now(),rv:0});saveWB(wb);
  const m=document.createElement('div');m.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--succ);color:#fff;padding:6px 14px;border-radius:16px;font-size:12px;z-index:999;';
  m.textContent='已收藏: '+word;document.body.appendChild(m);setTimeout(()=>m.remove(),1500);
}
function renderWB(){
  const wb=loadWB();$x('wbCount').textContent=wb.length+' 个单词';
  if(!wb.length){$x('wbList').innerHTML='';$x('wbEmpty').style.display='';return;}
  $x('wbEmpty').style.display='none';
  $x('wbList').innerHTML=wb.map((w,i)=>'<div class="wb-card"><span class="wb-word">'+w.w+'</span>'+(w.ipa?'<span class="wb-ipa">'+w.ipa+'</span>':'')+'<div class="wb-cn">'+w.w+'</div><div class="wb-ctx">"'+w.ctx+'"</div><span class="wb-play" data-wb="'+i+'">▶ 听发音</span></div>').join('');
}
$x('wbList').addEventListener('click',function(e){const b=e.target.closest('.wb-play');if(!b)return;const wb=loadWB();const w=wb[parseInt(b.dataset.wb)];if(w&&speechSynthesis){const u=new SpeechSynthesisUtterance(w.w);u.lang='en-US';u.rate=0.85;speechSynthesis.speak(u);}});
$x('wbExport').addEventListener('click',function(){const wb=loadWB();const csv='word,ipa,context,lessonId\n'+wb.map(w=>[w.w,w.ipa,'"'+w.ctx+'"',w.lid].join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='ehs_wb.csv';a.click();});
$x('wbClear').addEventListener('click',function(){if(confirm('清空？')){saveWB([]);renderWB();}});
$x('wbFlashcard').addEventListener('click',function(){const wb=loadWB();if(!wb.length)return;const w=wb[Math.floor(Math.random()*wb.length)];const a=prompt(w.w+(w.ipa?' '+w.ipa:'')+'\n\n'+w.ctx+'\n\n输入中文：');if(a&&a.trim()){w.rv=(w.rv||0)+1;saveWB(wb);}});
$x('wbBack').addEventListener('click',()=>switchView('player'));

// ================ SETTINGS ================
function loadSettings(){try{const s=JSON.parse(localStorage.getItem('ehs_set')||'{}');if(s.dark){S.dark=true;document.documentElement.setAttribute('data-theme','dark');$x('navTheme').textContent='☀️';}if(s.speed){S.rate=s.speed;$x('speedVal').value=s.speed;}}catch(e){}}
function saveSettings(){localStorage.setItem('ehs_set',JSON.stringify({dark:S.dark,speed:S.rate}));}
$x('navTheme').addEventListener('click',function(){S.dark=!S.dark;if(S.dark){document.documentElement.setAttribute('data-theme','dark');this.textContent='☀️';}else{document.documentElement.setAttribute('data-theme','light');this.textContent='🌙';}saveSettings();});

// ================ INIT ================
(function init(){
  loadSettings(); buildPool(); renderAll();
  // Restore position
  try{const p=JSON.parse(localStorage.getItem('ehs_resume_'+L().id)||'{}');if(p.ci>0){S.ci=p.ci;updateSubCard(S.ci);updateProg(S.ci);}}catch(e){}
})();
// Save position on every play  
const origPlay=play; play=function(i){
  origPlay(i);
  try{localStorage.setItem('ehs_resume_'+L().id,JSON.stringify({ci:i,ts:Date.now()}));}catch(e){}
};
</script></body></html>
